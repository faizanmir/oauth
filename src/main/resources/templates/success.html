<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#11998e">
    <title>Success!</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-container success-container">
        <div class="success-icon">✓</div>
        <h2 th:text="${title ?: 'Success!'}">Success!</h2>
        <p th:text="${message ?: 'Operation completed successfully'}">
            You have been successfully logged in
        </p>

        <div class="countdown" id="countdown">3</div>
        <p style="color: #999; font-size: 14px; margin-top: 10px;">
            This tab will close automatically...
        </p>

        <button class="btn" onclick="closeWindow()" style="margin-top: 20px;">
            Return to App Now
        </button>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let count = 3;
        const countdownEl = document.getElementById('countdown');

        // Get tokens from server
        const accessToken = /*[[${accessToken}]]*/ null;
        const refreshToken = /*[[${refreshToken}]]*/ null;
        const expiresIn = /*[[${expiresIn}]]*/ null;
        const userData = /*[[${userData}]]*/ null;

        // Countdown
        const interval = setInterval(() => {
            count--;
            countdownEl.textContent = count;

            if (count <= 0) {
                clearInterval(interval);
                closeWindow();
            }
        }, 1000);

        function closeWindow() {
            // Try to close the Chrome Custom Tab
            if (window.opener || window.history.length <= 1) {
                window.close();
            }

            // Build redirect URL with tokens for mobile app
            const redirectUrl = /*[[${redirectUrl}]]*/ null;
            if (redirectUrl) {
                // Append tokens to redirect URL
                const url = new URL(redirectUrl);
                if (accessToken) url.searchParams.set('access_token', accessToken);
                if (refreshToken) url.searchParams.set('refresh_token', refreshToken);
                if (expiresIn) url.searchParams.set('expires_in', expiresIn);
                if (userData && userData.username) url.searchParams.set('username', userData.username);

                console.log('Redirecting to:', url.toString());
                window.location.href = url.toString();
            } else {
                // Default: try to close or redirect to homepage
                setTimeout(() => {
                    window.location.href = '/';
                }, 500);
            }
        }

        // Send message to Android app (if WebView or Custom Tab supports it)
        try {
            if (window.Android && window.Android.onLoginSuccess) {
                const data = {
                    accessToken: accessToken,
                    refreshToken: refreshToken,
                    expiresIn: expiresIn,
                    userData: userData
                };
                window.Android.onLoginSuccess(JSON.stringify(data));
            }
        } catch (e) {
            console.log('Android interface not available');
        }
        /*]]>*/
    </script>
</body>
</html>
