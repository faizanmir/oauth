<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#11998e">
    <title>Success!</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        /* Optional: Add a simple spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #11998e;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="auth-container success-container">
    <div class="success-icon">✓</div>
    <h2 th:text="${title ?: 'Success!'}">Success!</h2>
    <p th:text="${message ?: 'Login successful. Redirecting to app...'}">
        Login successful. Redirecting to app...
    </p>

    <div class="spinner"></div>
    <div class="countdown" id="countdown">3</div>

    <p style="color: #999; font-size: 14px; margin-top: 10px;">
        If the app doesn't open, click below:
    </p>

    <button class="btn" id="redirectBtn" onclick="forceRedirect()" style="margin-top: 20px;">
        Open App
    </button>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // ================= CONFIGURATION =================
    // ⚠️ IMPORTANT: Check your build.gradle (Module: app) for 'applicationId'
    // It must match this value exactly for the redirect to work!
    const ANDROID_PACKAGE_NAME = "org.learn.tokenviaoauth2";
    // =================================================

    let count = 3;
    const countdownEl = document.getElementById('countdown');

    // Get tokens injected by Thymeleaf
    const accessToken = /*[[${accessToken}]]*/ '';
    const refreshToken = /*[[${refreshToken}]]*/ '';
    const expiresIn = /*[[${expiresIn}]]*/ '';
    const userData = /*[[${userData}]]*/ null;
    const baseRedirectUrl = /*[[${redirectUrl}]]*/ '';

    // Timer Logic
    const interval = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
            clearInterval(interval);
            forceRedirect();
        }
    }, 1000);

    function forceRedirect() {
        if (!baseRedirectUrl) {
            console.error("No redirect URL found");
            return;
        }

            // Build redirect URL with tokens for mobile app
            const redirectUrl = /*[[${redirectUrl}]]*/ null;
            if (redirectUrl) {
                // Append tokens to redirect URL
                const url = new URL(redirectUrl);
                if (accessToken) url.searchParams.set('access_token', accessToken);
                if (refreshToken) url.searchParams.set('refresh_token', refreshToken);
                if (expiresIn) url.searchParams.set('expires_in', expiresIn);
                if (userData && userData.username) url.searchParams.set('username', userData.username);

        // 2. Build the standard HTTPS URL (for fallback/debugging)
        // e.g., https://web-production.../oauth2/callback?access_token=...
        const fullHttpsUrl = baseRedirectUrl + (baseRedirectUrl.includes('?') ? '&' : '?') + params.toString();

        // 3. Construct the ANDROID INTENT URL
        // This is the magic part that forces the app to open even on HTTPS links
        // Format: intent://<host>/<path>?<query>#Intent;scheme=https;package=<app_id>;end;

        // Parse the base URL to get host and path
        try {
            const urlObj = new URL(baseRedirectUrl);
            const scheme = urlObj.protocol.replace(':', ''); // 'https'
            const host = urlObj.host;                        // 'web-production...'
            const path = urlObj.pathname;                    // '/oauth2/callback'

            // Construct the Intent URI
            const intentUri = `intent://${host}${path}?${params.toString()}#Intent;scheme=${scheme};package=${ANDROID_PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(fullHttpsUrl)};end`;

            console.log("Redirecting to Intent:", intentUri);

            // 4. Trigger the redirect
            window.location.href = intentUri;

        } catch (e) {
            console.error("Error building intent URL:", e);
            // Fallback to standard URL
            window.location.href = fullHttpsUrl;
        }
    }

    // Run immediately
    setTimeout(forceRedirect, 500);

    /*]]>*/
</script>
</body>
</html>
