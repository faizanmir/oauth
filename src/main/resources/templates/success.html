<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#11998e">
    <title>Success!</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container success-container">
    <div class="success-icon">✓</div>
    <h2 th:text="${title ?: 'Success!'}">Success!</h2>
    <p th:text="${message ?: 'Done.'}">Done.</p>

    <a th:href="@{/auth/login}" style="display: block; margin-top: 16px; color: #667eea; text-decoration: none;">
        Back to Login
    </a>
</div>
</body>
</html>
