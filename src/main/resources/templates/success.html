<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#11998e">
    <title>Success!</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        /* Optional: Add a simple spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #11998e;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="auth-container success-container">
    <div class="success-icon">✓</div>
    <h2 th:text="${title ?: 'Success!'}">Success!</h2>
    <p th:text="${message ?: 'Login successful. Redirecting to app...'}">
        Login successful. Redirecting to app...
    </p>

    <div class="spinner"></div>
    <div class="countdown" id="countdown">3</div>

    <!-- Debug Info (visible on page) -->
    <div id="debugInfo" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; font-size: 12px; text-align: left; font-family: monospace;">
        <strong>Debug Info:</strong><br>
        <div id="debugContent">Loading...</div>
    </div>

    <p style="color: #999; font-size: 14px; margin-top: 10px;">
        If the app doesn't open, click below:
    </p>

    <button class="btn" id="redirectBtn" onclick="forceRedirect()" style="margin-top: 20px;">
        Open App
    </button>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // ================= CONFIGURATION =================
    // ⚠️ IMPORTANT: Check your build.gradle (Module: app) for 'applicationId'
    // It must match this value exactly for the redirect to work!
    const ANDROID_PACKAGE_NAME = "org.learn.tokenviaoauth2";
    // =================================================

    let count = 3;
    const countdownEl = document.getElementById('countdown');

    // Get tokens injected by Thymeleaf
    const accessToken = /*[[${accessToken}]]*/ '';
    const refreshToken = /*[[${refreshToken}]]*/ '';
    const expiresIn = /*[[${expiresIn}]]*/ '';
    const userData = /*[[${userData}]]*/ null;
    const baseRedirectUrl = /*[[${redirectUrl}]]*/ '';

    // DEBUG: Log all values (console)
    console.log("=== SUCCESS PAGE LOADED ===");
    console.log("Access Token:", accessToken ? `Present (${accessToken.length} chars)` : "MISSING");
    console.log("Refresh Token:", refreshToken ? `Present (${refreshToken.length} chars)` : "MISSING");
    console.log("Expires In:", expiresIn || "MISSING");
    console.log("User Data:", userData);
    console.log("Base Redirect URL:", baseRedirectUrl || "MISSING");

    // DEBUG: Show visible debug info on page
    const debugEl = document.getElementById('debugContent');
    const debugInfo = `
        Access Token: ${accessToken ? '✅ Present (' + accessToken.substring(0, 20) + '...)' : '❌ MISSING'}<br>
        Refresh Token: ${refreshToken ? '✅ Present (' + refreshToken.substring(0, 20) + '...)' : '❌ MISSING'}<br>
        Expires In: ${expiresIn || '❌ MISSING'}<br>
        Username: ${userData?.username || '❌ MISSING'}<br>
        <strong>Redirect URL: ${baseRedirectUrl ? '✅ ' + baseRedirectUrl : '❌ MISSING - THIS IS THE PROBLEM!'}</strong>
    `;
    debugEl.innerHTML = debugInfo;

    if (!baseRedirectUrl) {
        console.error("❌ CRITICAL: No redirect URL provided! Cannot redirect to app.");
        console.error("This usually means redirect_url was not passed to /auth/login");
        debugEl.innerHTML += '<br><br><strong style="color: red;">⚠️ ERROR: No redirect URL! Cannot redirect to app.</strong><br>The login URL must include ?redirect_url=...';
        // Don't alert, just show on page
    }

    // Timer Logic
    const interval = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
            clearInterval(interval);
            forceRedirect();
        }
    }, 1000);

    function forceRedirect() {
        console.log("forceRedirect() called");

        if (!baseRedirectUrl) {
            console.error("No redirect URL found");
            document.getElementById('debugContent').innerHTML += '<br><strong style="color: red;">❌ Redirect FAILED: No redirect URL</strong>';
            return;
        }

        // 1. Build URL parameters with tokens
        const params = new URLSearchParams();
        if (accessToken) params.set('access_token', accessToken);
        if (refreshToken) params.set('refresh_token', refreshToken);
        if (expiresIn) params.set('expires_in', expiresIn);
        if (userData && userData.username) params.set('username', userData.username);

        // 2. Build the standard HTTPS URL
        // Android App Links are verified, so HTTPS URLs will automatically open the app
        const fullHttpsUrl = baseRedirectUrl + (baseRedirectUrl.includes('?') ? '&' : '?') + params.toString();

        console.log("Redirecting to:", fullHttpsUrl);
        console.log("Tokens:", {
            accessToken: !!accessToken,
            refreshToken: !!refreshToken,
            expiresIn: expiresIn,
            username: userData?.username
        });

        // Show on page
        document.getElementById('debugContent').innerHTML += `<br><br><strong style="color: green;">🚀 Redirecting now to:</strong><br>${fullHttpsUrl.substring(0, 100)}...`;

        // 3. Redirect using standard HTTPS URL (App Links will intercept it)
        console.log("Executing window.location.href =", fullHttpsUrl);
        window.location.href = fullHttpsUrl;
        console.log("Redirect executed!");
    }

    // Run immediately
    setTimeout(forceRedirect, 500);

    /*]]>*/
</script>
</body>
</html>
