<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>Login - OAuth Server</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}">Invalid credentials</span>
        </div>

        <!-- Success Message -->
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}">Success!</span>
        </div>

        <form th:action="@{/auth/login}" method="post" id="loginForm">
            <!-- Hidden field to preserve redirect URL -->
            <input type="hidden" name="redirect_url" th:value="${redirectUrl}" th:if="${redirectUrl}">

            <div class="form-group">
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="link-text">
            Don't have an account?
            <a th:href="@{/auth/register(redirect_url=${redirectUrl})}">Create Account</a>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = 'Signing In... <span class="spinner"></span>';
            btn.disabled = true;
        });

        // Auto-fill from URL parameters (if coming from Android)
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        if (username) {
            document.getElementById('username').value = username;
            document.getElementById('password').focus();
        }
    </script>
</body>
</html>
